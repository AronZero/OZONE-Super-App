name: ozone
description: "OZONE: personal offline super app"
publish_to: 'none'
version: 1.1.0+12

environment:
  sdk: ^3.13.4
  flutter: 3.47.5

# Every version is pinned exactly and was checked on 14 Oct 2026 (docs/spec/F3-02-packages.md).
# Follow the safety procedure in F3-02 §4 before changing any line.
dependencies:
  flutter:
    sdk: flutter
  drift: 2.35.0
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  cryptography: 2.9.0
  local_auth: 3.0.2
  flutter_secure_storage: 11.2.0
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_quill: 11.6.0
  excel: 4.0.6
  file_selector: 1.1.0
  share_plus: 13.3.0
  path_provider: 2.1.6
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.35.0
  build_runner: 2.16.1
  analyzer: 14.4.0 # build-time only; 14.5.0 was under 14 days old and breaks build_runner 2.16.1
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Manrope/OFL.txt
    - assets/fonts/MaterialSymbolsRounded/LICENSE.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-VariableFont_wght.ttf
    # Material Symbols Rounded (Apache-2.0), google/material-design-icons commit bd8cb85 (25 Sep 2026).
    # Release builds keep only the glyphs used in lib/core/ui/theme/oz_icons.dart.
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded/MaterialSymbolsRounded.ttf
