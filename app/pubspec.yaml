name: ozone
description: "OZONE: personal offline super app"
publish_to: 'none'
version: 1.2.0+16

environment:
  sdk: ^3.13.4
  flutter: 3.47.5

# Every version is pinned exactly and was checked on 14 Oct 2026 (docs/spec/F3-02-packages.md).
# Follow the safety procedure in F3-02 Â§4 before changing any line.
dependencies:
  flutter:
    sdk: flutter
  drift: 2.35.0
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  cryptography: 2.9.0
  local_auth: 3.0.2
  flutter_secure_storage: 11.2.0
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_quill: 11.6.0
  excel: 4.0.6
  file_selector: 1.1.0
  share_plus: 13.3.0
  path_provider: 2.1.6
  intl: 0.20.3
  image_picker: 1.2.3 # recipe photos (F4-03 §1)
  archive: 3.6.1 # backup .zip (F4-01 §5); already used by excel
  google_mlkit_text_recognition: 0.17.1 # reading scanned pages on the phone (F4-03 §1)
  google_mlkit_commons: 0.13.0
  # Transitive pins: the resolver picked versions under 14 days old (F3-02 §4, 19 Oct 2026).
  image_picker_ios: 0.8.13+9
  image_picker_platform_interface: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.35.0
  build_runner: 2.16.1
  analyzer: 14.4.0 # build-time only; 14.5.0 was under 14 days old and breaks build_runner 2.16.1
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Manrope/OFL.txt
    - assets/fonts/MaterialSymbolsRounded/LICENSE.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-VariableFont_wght.ttf
    # Material Symbols Rounded (Apache-2.0), google/material-design-icons commit bd8cb85 (25 Sep 2026).
    # Release builds keep only the glyphs used in lib/core/ui/theme/oz_icons.dart.
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded/MaterialSymbolsRounded.ttf
