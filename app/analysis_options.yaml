include: package:flutter_lints/flutter.yaml

# Stricter checks (docs/spec/F3-01 §6).
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - unawaited_futures
